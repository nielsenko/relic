name: benchmark
description: Benchmarks for Relic router.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # The fork with PerfCounters and the dart build cli AOT path.
  bench_press:
    git:
      url: https://github.com/nielsenko/bench_press
      ref: ebc9786ac5a9aaabb4bb6a717091618abf563ca4
  benchmark_harness: ^2.3.1
  cli_tools: ">=0.11.0 <0.15.0"
  config: ">=0.8.4 <0.11.0"
  ffi: ^2.1.0
  git: ^2.2.1
  path: ^1.9.0
  relic:
    path: ../relic
  relic_native:
    path: ../relic_native
  routingkit: ^5.1.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  spanner: ^1.0.5
  stream_channel: ^2.1.1
  vm_service: ^15.0.0
  web_socket: ^1.0.1

dev_dependencies:
  serverpod_lints: ">=3.0.0 <5.0.0"

# The relic packages of this tree for the ones relic and relic_native
# bring in.
dependency_overrides:
  relic_core:
    path: ../relic_core
  relic_headers:
    path: ../relic_headers
  relic_io:
    path: ../relic_io
