[package]
name = "relic_baseline_tungstenite"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "relic_baseline_ws_echo"
path = "src/echo.rs"

[[bin]]
name = "relic_baseline_ws_load"
path = "src/load.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
tokio-tungstenite = "0.30"

[profile.release]
lto = true
codegen-units = 1
